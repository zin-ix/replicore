name: Release

# Every push to these branches builds, self-checks and publishes a new GitHub Release.
# Version = latest vX.Y.Z tag with the patch number bumped (v2.0.0 -> v2.0.1).
# Pushing a tag like v2.1.0 yourself releases exactly that version instead.
on:
  push:
    branches:
      - main
      - feat/fluent-ui
    tags:
      - 'v*'
    paths-ignore:
      - '.codegraph/**'
      - '.github/context-mode/**'
  workflow_dispatch:

permissions:
  contents: write

# Two pushes close together must not compute the same version
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag" -and $ref -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $ver = $Matches[1..3] -join '.'
          } else {
            $latest = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            $nextFromTag = if ($latest) {
              $t = [version]$latest.Substring(1)
              [version]"$($t.Major).$($t.Minor).$($t.Build + 1)"
            } else {
              [version]"2.0.0"
            }
            $csproj = ([xml](Get-Content Replicore.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $fromCsproj = if ($csproj -match '^\d+\.\d+\.\d+$') { [version]$csproj } else { [version]"0.0.0" }
            $chosen = if ($fromCsproj -gt $nextFromTag) { $fromCsproj } else { $nextFromTag }
            $ver = "$($chosen.Major).$($chosen.Minor).$($chosen.Build)"
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Releasing version: v$ver"

      - name: Self-check (Disk ID, GPT, 99% tail read)
        shell: pwsh
        run: |
          dotnet build -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o ./selfcheck
          dotnet exec ./selfcheck/Replicore.dll --self-check
          if ($LASTEXITCODE -ne 0) { throw "Self-check failed ($LASTEXITCODE)" }

      - name: Publish Self-Contained Executable
        run: dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:Version=${{ env.APP_VERSION }} -p:AssemblyVersion=${{ env.APP_VERSION }}.0 -p:FileVersion=${{ env.APP_VERSION }}.0 -p:InformationalVersion=${{ env.APP_VERSION }} --self-contained true -o ./publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Installer Wizard
        shell: pwsh
        run: iscc /DMyAppVersion="${{ env.APP_VERSION }}" installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.APP_VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            publish/Replicore.exe
            publish_installer/*.exe
